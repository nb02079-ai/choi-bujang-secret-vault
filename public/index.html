<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 10px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth #session { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .auth #who { font-weight: 700; overflow-wrap: anywhere; }
    .auth #auth-message { min-height: 1.4em; margin: 12px 0 0; font-size: 15px; color: #ffb3c0; }
    .auth #auth-message.ok { color: #9be3b0; }
    .auth [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 계정만 가상 메모를 볼 수 있습니다. 로그인은 신원 확인일 뿐이라, 로그인한 계정은 아직 다른 사람의 자료도 볼 수 있습니다. 이 부분은 4단계에서 막습니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">계정</h2>
      <form id="login-form">
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login" type="submit">로그인</button>
      </form>
      <div id="session" hidden>
        <span id="who"></span>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <p id="auth-message" role="alert" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    // Project URL과 publishable key는 브라우저에 공개해도 되는 값입니다. 비밀키는 여기에 넣지 않습니다.
    const supabase = createClient('https://hcaygyndhpfqrwlfbpqt.supabase.co',
      'sb_publishable_j3xyRhkca4lquGrIEHq9Hg_5QN7ei8o');

    const form = document.querySelector('#login-form');
    const sessionBox = document.querySelector('#session');
    const who = document.querySelector('#who');
    const message = document.querySelector('#auth-message');
    const loginButton = document.querySelector('#login');
    const say = (text, ok = false) => {
      message.textContent = text;
      message.classList.toggle('ok', ok);
    };
    const showSession = (session) => {
      const signedIn = Boolean(session?.user);
      form.hidden = signedIn;
      sessionBox.hidden = !signedIn;
      who.textContent = signedIn ? `로그인됨: ${session.user.email}` : '';
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      say('로그인 중입니다.');
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: form.email.value.trim(), password: form.password.value,
        });
        form.password.value = '';
        if (error) say(`로그인하지 못했습니다: ${error.message}`);
        else say('로그인했습니다.', true);
      } catch (error) {
        say(`로그인하지 못했습니다: ${error.message}`);
      } finally {
        loginButton.disabled = false;
      }
    });

    document.querySelector('#logout').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) say(`로그아웃하지 못했습니다: ${error.message}`);
      else say('로그아웃했습니다.', true);
    });

    const list = document.querySelector('#notes');
    const listMessage = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };
    let latest = 0;
    const loadNotes = async (session) => {
      const ticket = ++latest;
      if (!session?.access_token) {
        listMessage('로그인하면 가상 메모가 보입니다.');
        return;
      }
      listMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (response.status === 401) throw new Error('로그인이 확인되지 않아 자료를 보여 줄 수 없습니다.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (ticket !== latest) return;
        if (!data.notes.length) {
          listMessage('표시할 메모가 없습니다.');
          return;
        }
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        if (ticket === latest) listMessage(error.message);
      }
    };

    // 로그인 상태가 바뀔 때만 화면과 자료를 다시 맞춥니다.
    let appliedToken;
    const apply = (session) => {
      const token = session?.access_token ?? null;
      if (token === appliedToken) return;
      appliedToken = token;
      showSession(session);
      loadNotes(session);
    };
    supabase.auth.onAuthStateChange((_event, session) => apply(session));
    apply((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
