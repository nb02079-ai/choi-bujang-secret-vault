<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 10px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth #session { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .auth #who { font-weight: 700; overflow-wrap: anywhere; }
    .auth #auth-message { min-height: 1.4em; margin: 12px 0 0; font-size: 15px; color: #ffb3c0; }
    .auth #auth-message.ok { color: #9be3b0; }
    [hidden] { display: none !important; }
    .editor { margin: 0 0 26px; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .editor h2 { margin: 0 0 12px; font-size: 18px; }
    .editor form, li form.edit { display: grid; gap: 10px; }
    .editor label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .editor input, .editor textarea, li form.edit input, li form.edit textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; font-size: 16px; }
    .editor button, li button { padding: 8px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font-size: 15px; font-weight: 700; cursor: pointer; }
    .editor button:disabled { opacity: .6; cursor: wait; }
    li button.danger { background: #d07384; color: #101a28; }
    li .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    li span { overflow-wrap: anywhere; white-space: pre-wrap; }
    .editor #note-message { min-height: 1.4em; margin: 12px 0 0; font-size: 15px; color: #ffb3c0; }
    .editor #note-message.ok { color: #9be3b0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 계정은 자기 가상 메모만 읽고 추가·수정·삭제할 수 있습니다. 다른 사람의 메모는 보이지 않고, id를 알아도 접근이 거부됩니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">계정</h2>
      <form id="login-form">
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login" type="submit">로그인</button>
      </form>
      <div id="session" hidden>
        <span id="who"></span>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <p id="auth-message" role="alert" aria-live="polite"></p>
    </section>
    <section class="editor" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">가상 메모 추가</h2>
      <form id="note-form">
        <label>제목 <input id="title" name="title" maxlength="100" required></label>
        <label>내용 <textarea id="body" name="body" maxlength="2000" rows="3"></textarea></label>
        <button id="add" type="submit">메모 추가</button>
      </form>
      <p id="note-message" role="alert" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    // Project URL과 publishable key는 브라우저에 공개해도 되는 값입니다. 비밀키는 여기에 넣지 않습니다.
    const supabase = createClient('https://hcaygyndhpfqrwlfbpqt.supabase.co',
      'sb_publishable_j3xyRhkca4lquGrIEHq9Hg_5QN7ei8o');

    const form = document.querySelector('#login-form');
    const sessionBox = document.querySelector('#session');
    const who = document.querySelector('#who');
    const message = document.querySelector('#auth-message');
    const loginButton = document.querySelector('#login');
    const say = (text, ok = false) => {
      message.textContent = text;
      message.classList.toggle('ok', ok);
    };
    const showSession = (session) => {
      const signedIn = Boolean(session?.user);
      form.hidden = signedIn;
      sessionBox.hidden = !signedIn;
      document.querySelector('#editor').hidden = !signedIn;
      who.textContent = signedIn ? `로그인됨: ${session.user.email}` : '';
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      say('로그인 중입니다.');
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: form.email.value.trim(), password: form.password.value,
        });
        form.password.value = '';
        if (error) say(`로그인하지 못했습니다: ${error.message}`);
        else say('로그인했습니다.', true);
      } catch (error) {
        say(`로그인하지 못했습니다: ${error.message}`);
      } finally {
        loginButton.disabled = false;
      }
    });

    document.querySelector('#logout').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) say(`로그아웃하지 못했습니다: ${error.message}`);
      else say('로그아웃했습니다.', true);
    });

    const list = document.querySelector('#notes');
    const noteForm = document.querySelector('#note-form');
    const noteMessage = document.querySelector('#note-message');
    const addButton = document.querySelector('#add');
    const sayNote = (text, ok = false) => {
      noteMessage.textContent = text;
      noteMessage.classList.toggle('ok', ok);
    };
    const listMessage = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    // 모든 자료 요청은 로그인 토큰을 실어 서버 API로 보냅니다. 사용자 ID는 서버가 토큰에서 확인합니다.
    const callApi = async (method, path, payload) => {
      const { data } = await supabase.auth.getSession();
      const token = data.session?.access_token;
      if (!token) throw new Error('로그인이 필요합니다.');
      const headers = { Authorization: `Bearer ${token}` };
      if (payload !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, cache: 'no-store', headers,
        body: payload === undefined ? undefined : JSON.stringify(payload),
      });
      let result = null;
      try { result = await response.json(); } catch { /* 본문 없음 */ }
      if (response.status === 401) throw new Error('로그인이 확인되지 않아 요청을 처리할 수 없습니다.');
      if (!response.ok) throw new Error(result?.error ?? `요청이 실패했습니다 (HTTP ${response.status})`);
      return result;
    };

    const element = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const actionButton = (label, onClick, className = '') => {
      const button = element('button', label, className);
      button.type = 'button';
      button.addEventListener('click', onClick);
      return button;
    };
    const run = async (task, success) => {
      try {
        await task();
        sayNote(success, true);
        await loadNotes();
      } catch (error) {
        sayNote(error.message);
      }
    };

    const renderNote = (note) => {
      const item = document.createElement('li');
      const showView = () => {
        const actions = element('div', undefined, 'actions');
        actions.append(
          actionButton('수정', showEdit),
          actionButton('삭제', () => {
            if (window.confirm('이 메모를 삭제할까요?')) {
              run(() => callApi('DELETE', `/api/notes/${note.id}`), '메모를 삭제했습니다.');
            }
          }, 'danger'));
        item.replaceChildren(element('strong', note.title), element('span', note.body), actions);
      };
      const showEdit = () => {
        const form = element('form', undefined, 'edit');
        const title = element('input');
        title.value = note.title;
        title.maxLength = 100;
        title.required = true;
        title.setAttribute('aria-label', '제목');
        const body = element('textarea');
        body.value = note.body;
        body.maxLength = 2000;
        body.rows = 3;
        body.setAttribute('aria-label', '내용');
        const actions = element('div', undefined, 'actions');
        const save = element('button', '저장');
        save.type = 'submit';
        actions.append(save, actionButton('취소', showView));
        form.append(title, body, actions);
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          run(() => callApi('PUT', `/api/notes/${note.id}`, { title: title.value, body: body.value }),
            '메모를 수정했습니다.');
        });
        item.replaceChildren(form);
        title.focus();
      };
      showView();
      return item;
    };

    let latest = 0;
    let currentSession = null;
    const loadNotes = async () => {
      const ticket = ++latest;
      if (!currentSession?.access_token) {
        listMessage('로그인하면 내 메모가 보입니다.');
        return;
      }
      try {
        const notes = await callApi('GET', '/api/notes');
        if (ticket !== latest) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) {
          listMessage('아직 메모가 없습니다. 위에서 추가해 보세요.');
          return;
        }
        list.replaceChildren(...notes.map(renderNote));
      } catch (error) {
        if (ticket === latest) listMessage(error.message);
      }
    };

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      addButton.disabled = true;
      try {
        await callApi('POST', '/api/notes', {
          title: document.querySelector('#title').value, body: document.querySelector('#body').value,
        });
        noteForm.reset();
        sayNote('메모를 추가했습니다.', true);
        await loadNotes();
      } catch (error) {
        sayNote(error.message);
      } finally {
        addButton.disabled = false;
      }
    });

    // 로그인 상태가 바뀔 때만 화면과 자료를 다시 맞춥니다.
    let appliedToken;
    const apply = (session) => {
      const token = session?.access_token ?? null;
      if (token === appliedToken) return;
      appliedToken = token;
      currentSession = session ?? null;
      showSession(session);
      sayNote('');
      loadNotes();
    };
    supabase.auth.onAuthStateChange((_event, session) => apply(session));
    apply((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
